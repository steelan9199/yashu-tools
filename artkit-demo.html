<!doctype html>
<!-- artkit 样张 + selftest 回归样本：夜景与纸景各一幅，全部只用 artkit.css 组件 -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="artkit.css">
</head><body style="margin:0">
<div id="demo" style="width:900px">

  <div class="yk-sky" style="width:900px;height:520px">
    <div class="yk-star" style="left:220px;top:70px"></div>
    <div class="yk-star" style="left:560px;top:44px"></div>
    <div class="yk-star yk-star--dim" style="left:80px;top:260px"></div>
    <div class="yk-star" style="left:440px;top:120px"></div>
    <div class="yk-star" style="left:640px;top:230px"></div>
    <div class="yk-moon" style="right:96px;top:44px"></div>
    <div class="yk-sea yk-sea--1" style="bottom:-70px;height:200px;transform:rotate(1.8deg)"></div>
    <div class="yk-sea yk-sea--2" style="bottom:-95px;height:210px;transform:rotate(-1.6deg)"></div>
    <div class="yk-sea yk-sea--3" style="bottom:-120px;height:220px;transform:rotate(1deg)"></div>
    <div class="yk-boat" style="bottom:60px;right:150px"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="yk-folder" style="bottom:96px;left:96px"><span></span></div>
    <div class="yk-text" style="left:70px;top:88px">
      <span class="yk-tag">AI 手记</span>
      <h1 class="yk-title" style="margin-top:26px">剪纸夜海组件库</h1>
      <p class="yk-sub" style="margin-top:18px">一套家当，反复拼装</p>
    </div>
  </div>

  <div class="yk-paper" style="width:900px;height:430px;margin-top:20px">
    <div class="yk-text" style="left:60px;top:40px">
      <span class="yk-tag yk-tag--ink">纸面世界</span>
      <h2 class="yk-title" style="font-size:30px;margin-top:14px">同一套类名，换个底色</h2>
    </div>
    <div class="yk-doc yk-doc--pass" style="left:120px;top:170px">
      <b class="l" style="width:70%"></b><b class="l"></b><b class="l" style="width:85%"></b>
      <b class="l" style="width:55%"></b><b class="l" style="width:78%"></b>
      <span class="yk-stamp">过</span>
    </div>
    <div class="yk-doc yk-doc--fail" style="left:300px;top:210px;transform:rotate(6deg)">
      <b class="l" style="width:65%"></b><b class="l"></b><b class="l" style="width:78%"></b>
      <b class="l" style="width:50%"></b><b class="l" style="width:70%"></b>
      <span class="yk-stamp">留</span>
    </div>
    <div class="yk-tablet" style="left:500px;top:170px">
      <b class="l" style="top:28px;width:120px;opacity:.95"></b>
      <b class="l" style="top:58px"></b>
      <b class="l" style="top:86px"></b>
      <b class="l" style="top:114px;width:150px"></b>
      <div class="yk-seal" style="right:-26px;bottom:-26px;position:absolute">铁律</div>
    </div>
    <p class="yk-note" style="position:absolute;left:500px;top:352px">字体与字重铁律内建，谁拼都不违规。</p>
  </div>

</div>
</body></html>
