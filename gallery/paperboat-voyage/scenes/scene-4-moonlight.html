<!doctype html>
<!-- 第四幕 月下：云开浪平，大圆月当空，灯笼呼吸，一颗流星划过 -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="artkit.css">
<style>
body{margin:0}
.calm1{animation:cl 6.25s ease-in-out infinite alternate}
.calm2{animation:cl 6.25s ease-in-out infinite alternate;animation-delay:-3s}
.calm3{animation:cl 6.25s ease-in-out infinite alternate;animation-delay:-1.5s}
@keyframes cl{from{margin-left:-6px}to{margin-left:6px}}
.glide{animation:gd 10s linear infinite;transform-origin:center bottom}
@keyframes gd{from{transform:translateX(0) scale(1.3)}to{transform:translateX(150px) scale(1.3)}}
.bob{animation:bb 3.125s ease-in-out infinite alternate}
@keyframes bb{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-5px) rotate(1.5deg)}}
.glow{animation:gl 2.5s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.5}to{opacity:1}}
.shoot{position:absolute;width:90px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(242,233,216,0),#f2e9d8);
  animation:sh 10s linear infinite;opacity:0}
@keyframes sh{0%{transform:rotate(-16deg) translateX(0);opacity:0}
  4%{opacity:.95}10%{transform:rotate(-16deg) translateX(280px);opacity:0}
  100%{transform:rotate(-16deg) translateX(280px);opacity:0}}
.tk{opacity:.8;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:.9}}
</style></head>
<body>
<div id="stage" class="yk-sky" style="width:640px;height:360px">
  <div class="yk-star tk" style="left:110px;top:54px"></div>
  <div class="yk-star tk" style="left:200px;top:110px;animation-delay:-1s"></div>
  <div class="yk-star tk" style="left:320px;top:40px;animation-delay:-2s"></div>
  <div class="yk-star tk" style="left:90px;top:180px;animation-delay:-3s"></div>
  <div class="yk-moon" style="right:120px;top:42px;--yk-moon-size:170px"></div>
  <div class="shoot" style="left:100px;top:64px"></div>
  <div class="glide" style="position:absolute;left:170px;bottom:64px">
    <div class="yk-boat bob"><i class="glow"></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="yk-sea yk-sea--1 calm1" style="left:-130px;right:-130px;bottom:-62px;height:172px;transform:rotate(1.2deg)"></div>
  <div class="yk-sea yk-sea--2 calm2" style="left:-130px;right:-130px;bottom:-88px;height:186px;transform:rotate(-1.3deg)"></div>
  <div class="yk-sea yk-sea--3 calm3" style="left:-130px;right:-130px;bottom:-114px;height:200px;transform:rotate(.7deg)"></div>
</div>
</body></html>
