<!doctype html>
<!-- 第六幕 归港：船靠岸，塔窗亮起，与灯笼同色同频 -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="artkit.css">
<style>
body{margin:0}
.dock{animation:dk 10s ease-out infinite;transform-origin:center bottom}
@keyframes dk{from{transform:translateX(120px) scale(1.3)}to{transform:translateX(0) scale(1.3)}}
.bob{animation:bb 3.125s ease-in-out infinite alternate}
@keyframes bb{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-4px) rotate(1.5deg)}}
.glow,.win{animation:gl 2.5s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.55}to{opacity:1}}
.win{position:absolute;left:22px;top:44px;width:18px;height:14px;background:#ffd97a;border-radius:2px;
  box-shadow:0 0 14px 5px rgba(255,217,122,.35)}
.sway1{animation:sw 6.25s ease-in-out infinite alternate}
.sway2{animation:sw 6.25s ease-in-out infinite alternate;animation-delay:-3s}
@keyframes sw{from{margin-left:-5px}to{margin-left:5px}}
.tk{opacity:.6;animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:.75}}
</style></head>
<body>
<div id="stage" class="yk-sky" style="width:640px;height:360px">
  <div class="yk-star tk" style="left:160px;top:56px"></div>
  <div class="yk-star tk" style="left:360px;top:40px;animation-delay:-1.2s"></div>
  <div class="yk-star tk" style="left:500px;top:100px;animation-delay:-2.4s"></div>
  <div class="yk-moon" style="right:80px;top:34px;--yk-moon-size:96px"></div>
  <div class="yk-folder" style="right:60px;bottom:106px;transform:scale(.95);transform-origin:bottom right"><b class="win"></b></div>
  <div class="dock" style="position:absolute;left:250px;bottom:64px">
    <div class="yk-boat bob"><i class="glow"></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="yk-sea yk-sea--1 sway1" style="bottom:-60px;height:168px;transform:rotate(1.2deg)"></div>
  <div class="yk-sea yk-sea--2 sway2" style="bottom:-86px;height:184px;transform:rotate(-1.1deg)"></div>
  <div class="yk-sea yk-sea--3" style="bottom:-112px;height:198px;transform:rotate(.6deg)"></div>
</div>
</body></html>
