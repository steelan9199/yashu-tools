<!doctype html>
<!-- 第二幕 夜海：三层剪纸海视差推进，船身轻摇，星星眨眼 -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="artkit.css">
<style>
body{margin:0}
.tk{opacity:.7;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:.85}}
.px1{animation:p1 5s ease-in-out infinite alternate}
.px2{animation:p1 5s ease-in-out infinite alternate;animation-delay:-2.5s}
.px3{animation:p1 5s ease-in-out infinite alternate;animation-delay:-1.2s}
@keyframes p1{from{margin-left:-22px}to{margin-left:22px}}
.drift{animation:df 10s linear infinite;transform-origin:center bottom}
@keyframes df{from{transform:translateX(0) scale(1.3)}to{transform:translateX(120px) scale(1.3)}}
.bob{animation:bb 2.5s ease-in-out infinite alternate}
@keyframes bb{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
.glow{animation:gl 2.5s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.55}to{opacity:1}}
</style></head>
<body>
<div id="stage" class="yk-sky" style="width:640px;height:360px">
  <div class="yk-star tk" style="left:120px;top:60px"></div>
  <div class="yk-star tk" style="left:260px;top:36px;animation-delay:-1s"></div>
  <div class="yk-star tk" style="left:420px;top:96px;animation-delay:-2s"></div>
  <div class="yk-star tk" style="left:540px;top:60px;animation-delay:-.5s"></div>
  <div class="yk-star tk" style="left:80px;top:160px;animation-delay:-1.5s"></div>
  <div class="yk-moon" style="right:90px;top:36px;--yk-moon-size:110px"></div>
  <div class="drift" style="position:absolute;left:220px;bottom:64px">
    <div class="yk-boat bob"><i class="glow"></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="yk-sea yk-sea--1 px1" style="left:-130px;right:-130px;bottom:-64px;height:176px;transform:rotate(1.4deg)"></div>
  <div class="yk-sea yk-sea--2 px2" style="left:-130px;right:-130px;bottom:-90px;height:190px;transform:rotate(-1.5deg)"></div>
  <div class="yk-sea yk-sea--3 px3" style="left:-130px;right:-130px;bottom:-116px;height:205px;transform:rotate(.9deg)"></div>
</div>
</body></html>
